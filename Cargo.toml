# kami-apps — kotoba-lang Kami Engine reference product apps.
#
# Per ADR-2606011500: the robotics/sim apps (giemon, shibuya, tatekata,
# sarutahiko, funadaiku, …) are maintained canonically IN the kami-engine
# repository (kotoba-lang/kami-engine); this workspace holds reference product
# apps (bim/cad/live/maps3d/animeka-timeline). Existing *.etzhayyim.com service
# identities remain compatibility deployment surfaces.
[workspace]
resolver = "2"
members = [
    "kami-app-bim",
    "kami-app-cad",
    "kami-app-live",
    "kami-app-maps3d",
    "kami-app-animeka-timeline",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Mirror of the kami-engine workspace deps the apps inherit (keep versions in sync).
[workspace.dependencies]
glam = { version = "0.33", features = ["bytemuck", "serde"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
bytemuck = { version = "1", features = ["derive"] }
hecs = "0.10"
